how.badge=How It Works
how.title=Intelligent, Automated Surplus Logistics
how.subtitle=Food rescue cannot rely on slow manual coordination. AnnPath replaces administrative friction with deterministic matching algorithms and automated volunteer dispatch.
how.step1.badge=Donors
how.step1.title=List Surplus in Seconds
how.step1.desc=Restaurants, supermarkets, hotels, and caterers log available food quantity, category, dietary specs, and pickup windows.
how.step2.badge=Engine
how.step2.title=Smart Proximity Matching
how.step2.desc=The Urgency Engine calculates expiry countdowns and matches surplus against verified NGO demand vectors in real-time.
how.step3.badge=Dispatch
how.step3.title=Dispatch & Secure Handover
how.step3.desc=Automated volunteer dispatch with cryptographic 6-digit OTP verification ensures safe chain-of-custody from donor to recipient.
journey.badge=Controlled State Machine
journey.title=The Complete Food Rescue Journey
journey.subtitle=Every donation moves through strict, validated lifecycle transitions. No arbitrary status modifications. Full auditability.
roles.badge=Built for Real Actors
roles.title=Three Dedicated Roles. Zero Admin Bloat.
roles.subtitle=AnnPath operates strictly with three distinct roles, each equipped with purposeful, tailored tooling.
safety.badge=Trust & Safety
safety.title=End-to-End Integrity & Compliance
safety.subtitle=Food redistribution requires rigorous food safety, tamper evidence, and identity assurance.
cta.title=Join the Movement to End Food Waste
cta.subtitle=Whether you are a donor with surplus meals, an NGO serving hungry families, or a volunteer ready to transport, AnnPath provides the path.

