# ====================================================================
# ANNPATH GLOBAL CONFIGURATION PROPERTIES
# All production secrets must be supplied via environment variables
# ====================================================================

# Database Connection Settings
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:annpath}
db.username=${DB_USERNAME:}
db.password=${DB_PASSWORD:}
db.driver=com.mysql.cj.jdbc.Driver
db.pool.minIdle=5
db.pool.maxTotal=25
db.pool.maxWaitMillis=10000

# Application Environment & Base Settings
app.name=AnnPath
app.tagline=A Path from Surplus to Need
app.environment=${APP_ENVIRONMENT:development}
app.baseUrl=${APPLICATION_BASE_URL:http://localhost:8080/AnnPath}
app.defaultLanguage=en
app.defaultTimezone=UTC

# Food Urgency Thresholds (in hours)
urgency.critical.hours=2
urgency.expiringSoon.hours=6

# Volunteer Assignment Configuration
volunteer.responseTimeoutMinutes=15
volunteer.maxSearchRadiusKm=20.0
volunteer.maxConcurrentTasks=2

# Verification Engine Configuration
verification.autoApproveEligible=true
verification.minEstablishedYears=1

# File Upload Configuration
upload.directory=${ANNPATH_UPLOAD_DIR:${user.home}/.annpath/uploads}
upload.maxFileSizeBytes=5242880
upload.allowedExtensions=pdf,jpg,jpeg,png

# Security, Cookie & OTP Configuration
otp.expiryMinutes=10
otp.resendCooldownSeconds=60
otp.maxAttempts=3
security.sessionTimeoutMinutes=60
security.maxFailedLoginAttempts=5
security.accountLockoutMinutes=15
security.cookie.secure=${SECURE_COOKIES:false}

# API & CORS Configuration
api.allowed.origins=${API_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# ====================================================================
# NOTIFICATION GATEWAY (EMAIL SMTP & SMS REST API)
# ====================================================================
notification.inAppEnabled=true

# EMAIL GATEWAY (SMTP Credentials via Environment Variables)
notification.email.enabled=true
notification.email.smtp.host=${EMAIL_HOST:smtp.gmail.com}
notification.email.smtp.port=${EMAIL_PORT:587}
notification.email.smtp.user=${EMAIL_USERNAME:annpath.redistributionplatform@gmail.com}
notification.email.smtp.password=${EMAIL_PASSWORD:nejlpjxruzdvnixo}
notification.email.from=${EMAIL_FROM:annpath.redistributionplatform@gmail.com}
notification.email.smtp.tls=${EMAIL_USE_TLS:true}

# SMS GATEWAY (Fast2SMS is active by default for India +91 mobile OTPs)
notification.sms.enabled=${SMS_ENABLED:true}
notification.sms.provider=${SMS_PROVIDER:fast2sms}
# Paste your Fast2SMS API Key below or export SMS_API_KEY / FAST2SMS_API_KEY environment variable.
# Get your free API key at https://www.fast2sms.com -> Dev API
notification.sms.fast2sms.api.key=${SMS_API_KEY:}
notification.sms.twilio.account.sid=${TWILIO_ACCOUNT_SID:}
notification.sms.twilio.auth.token=${TWILIO_AUTH_TOKEN:}
notification.sms.twilio.from.number=${TWILIO_FROM_NUMBER:}

# ====================================================================
# RESCUE INTELLIGENCE LAYER (SIGNATURE DIFFERENTIATORS)
# ====================================================================
# Failure Recovery Configuration
failureRecovery.maxAttempts=3
failureRecovery.cooldownMinutes=10

# Rescue Bottleneck Detector Thresholds
bottleneck.requestDelayHours=2
bottleneck.pickupDelayHours=2
bottleneck.deliveryDelayHours=2
bottleneck.ngoCapacityThresholdRatio=0.90
